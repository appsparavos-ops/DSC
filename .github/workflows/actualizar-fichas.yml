name: Actualizar Fichas Médicas

on:
  schedule:
    # 18:00 Uruguay (21:00 UTC) - Lunes a Viernes
    - cron: '0 21 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Probar sin guardar cambios en Firebase'
        required: true
        type: boolean
        default: true

concurrency:
  group: actualizar-fichas-medicas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Fuerza el uso de Node 24 y oculta avisos de depreciación
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de Node.js
        run: npm install --no-audit --no-fund

      - name: Ejecutar Actualizador de Fichas Médicas
        run: node .github/scripts/run-fichas.js
        env:
          RENDER_API_URL: https://dsc-vh8j.onrender.com
          FICHAS_AUTOMATION_TOKEN: ${{ secrets.FICHAS_AUTOMATION_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}

      # Fallback si el job falla antes de que el script pueda enviar el informe.
      - name: Notificación de fallo de pipeline (fallback)
        if: failure()
        run: |
          echo "El job de GitHub Actions falló antes de que el script pudiera notificar."
          echo "Revisar los logs en: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
