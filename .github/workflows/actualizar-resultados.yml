name: Actualizar Resultados FUBB

on:
  schedule:
    # Corre todos los días a las 03:00 GMT (00:00 hora Uruguay GMT-3)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Permite ejecución manual desde GitHub Actions

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias (playwright)
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Ejecutar Sincronizador de Resultados FUBB
        run: node sincroFubb/run-resultados.js
        env:
          RESULTADOS_URL: ${{ secrets.RESULTADOS_URL }}
