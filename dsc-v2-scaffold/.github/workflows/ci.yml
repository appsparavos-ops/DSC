name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt
      - name: Compilar
        run: python -m compileall -q backend
      - name: Smoke test de la app
        run: python -c "from backend.app.health import app; c = app.test_client(); r = c.get('/api/health'); assert r.status_code == 200, r.data; print(r.get_json())"

  no-secrets:
    name: Chequeo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar archivos de clave o .env
        run: |
          set -e
          BAD=$(git ls-files | grep -Ei '(serviceAccount.*\.json|firebase-adminsdk.*\.json|^\.env$|.*\.pem$)' || true)
          if [ -n "$BAD" ]; then
            echo "Archivos prohibidos en el repo:"; echo "$BAD"; exit 1
          fi
          echo "OK: sin archivos de secretos"
